name: CI Mema.Mo Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Mema.Mo
        shell: cmd
        run: |
          cd Resources\Deployment\Windows
          build_MemaMo.bat VS2026
