name: Deploy Product Page and Doxygen to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Doxygen, Graphviz, Node.js and pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen graphviz nodejs npm pandoc

      - name: Install mermaid CLI
        run: sudo npm install -g @mermaid-js/mermaid-cli

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile

      - name: Copy image assets to Doxygen HTML output
        run: cp -r Resources docs/html/Resources

      - name: Build landing page from PRODUCTPAGE.md
        run: |
          pandoc PRODUCTPAGE.md \
            --template Resources/Documentation/page_template.html \
            --from markdown \
            --output index.html

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p site/doxygen
          cp index.html site/index.html
          cp -r docs/html/. site/doxygen/
          cp -r Resources site/Resources
          touch site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
